<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'">
  <title>战斗动画</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#181412;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center}
    #canvas{width:min(100%,calc(100vh * 530 / 318));max-height:100%;position:relative;aspect-ratio:530/318;flex:none}
    #stage{position:absolute;inset:0}
    #weapons{display:none;position:absolute;left:0;bottom:0;width:100%;height:71.4%;z-index:2}
    ruffle-player{display:block}
  </style>
  <script src="ruffle/ruffle.js"></script>
</head>
<body><div id="canvas"><div id="stage"></div><div id="weapons"></div></div><script src="replay-host.js"></script></body>
</html>
