name: DaLedou iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "daledou-ios/**"
      - ".github/workflows/daledou-ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: daledou-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DaLedou.xcodeproj \
            -scheme DaLedou \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee build.log
          xcode_status=${PIPESTATUS[0]}
          if [ "$xcode_status" -ne 0 ]; then
            grep -E ": error:|^error:|fatal error:" build.log | head -80 || true
            exit "$xcode_status"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r daledou-unsigned.ipa Payload
          ls -lh daledou-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: daledou-unsigned-ipa
          path: daledou-ios/daledou-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daledou-xcodebuild-log
          path: daledou-ios/build.log
          if-no-files-found: ignore
