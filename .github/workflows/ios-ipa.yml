name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ibox-fire-ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ibox-fire-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode project
        run: |
          xcodebuild -version
          xcodebuild -list -project IboxFire.xcodeproj

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project IboxFire.xcodeproj \
            -scheme IboxFire \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build 2>&1 | tee build.log
          xcode_status=${PIPESTATUS[0]}
          if [ "$xcode_status" -ne 0 ]; then
            echo "=== xcodebuild failed (exit $xcode_status) ==="
            errors=$(grep -E ": error:|^error:| error: |fatal error:" build.log | head -80 || true)
            warnings=$(grep -E ": warning:" build.log | head -20 || true)
            if [ -n "$errors" ]; then
              echo "$errors"
              while IFS= read -r line; do
                echo "::error::$line"
              done <<< "$errors"
            fi
            {
              echo "### xcodebuild errors"
              echo '```'
              if [ -n "$errors" ]; then echo "$errors"; else echo "(no : error: lines — see full log below)"; fi
              echo '```'
              if [ -n "$warnings" ]; then
                echo "### warnings (first 20)"
                echo '```'
                echo "$warnings"
                echo '```'
              fi
              echo "### full build.log"
              echo '```'
              cat build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build.log
            echo "=== FULL build.log ==="
            cat build.log
            exit "$xcode_status"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ibox-fire-ios/build.log
          if-no-files-found: ignore

      - name: Publish build log on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          cp ibox-fire-ios/build.log ci-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build.log
          git diff --staged --quiet || git commit -m "ci: update build log [skip ci]"
          git push

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r ibox-fire-unsigned.ipa Payload
          ls -lh ibox-fire-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ibox-fire-unsigned-ipa
          path: ibox-fire-ios/ibox-fire-unsigned.ipa
          if-no-files-found: error

      - name: Unit tests (simulator)
        continue-on-error: true
        run: |
          xcodebuild test \
            -project IboxFire.xcodeproj \
            -scheme IboxFire \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO
