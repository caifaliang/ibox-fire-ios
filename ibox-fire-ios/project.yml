name: ibox-fire
options:
  bundleIdPrefix: com.ibox
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.ibox.fire
    PRODUCT_NAME: ibox-fire
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
targets:
  ibox-fire:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibox.fire
        PRODUCT_MODULE_NAME: ibox_fire
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_TESTABILITY: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: iBox Fire
        UILaunchScreen: {}
        UIBackgroundModes:
          - processing
          - fetch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            ydaili.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            api3.ydaili.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
  ibox-fireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ibox-fire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibox.fire.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ibox-fire:
    build:
      targets:
        ibox-fire: all
    test:
      targets:
        - ibox-fireTests
    run:
      config: Debug
    archive:
      config: Release
